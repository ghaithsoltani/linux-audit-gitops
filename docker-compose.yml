# docker-compose.yml
# GitOps Pipeline Application Stack
# Version: Production
#
# Services:
#   nginx        - Web application server
#   prometheus   - Metrics collection
#   grafana      - Metrics visualization
#   node-exporter - Host system metrics
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#   Status:  docker compose ps

services:

  # ==========================================================================
  # NGINX — Web Application
  # ==========================================================================
  nginx:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: gitops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - gitops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.gitops.service=nginx"
      - "com.gitops.version=1.0.0"
      - "com.gitops.managed-by=docker-compose"

  # ==========================================================================
  # PROMETHEUS — Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gitops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - gitops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.gitops.service=prometheus"

  # ==========================================================================
  # GRAFANA — Metrics Visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: gitops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=10.245.99.201
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - gitops-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.gitops.service=grafana"

  # ==========================================================================
  # NODE EXPORTER — Host System Metrics
  # ==========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gitops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - gitops-network
    labels:
      - "com.gitops.service=node-exporter"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  gitops-network:
    driver: bridge
    name: gitops-network
    labels:
      - "com.gitops.managed-by=docker-compose"

# =============================================================================
# VOLUMES — Persistent data storage
# =============================================================================
volumes:
  prometheus-data:
    driver: local
    labels:
      - "com.gitops.service=prometheus"
  grafana-data:
    driver: local
    labels:
      - "com.gitops.service=grafana"
