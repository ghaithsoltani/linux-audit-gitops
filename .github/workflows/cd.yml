name: CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gitops-nginx

jobs:

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Image pushed successfully
        run: |
          echo "✅ Image pushed to GHCR"
          echo "Tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin
          echo "✅ Logged in to GHCR"

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Image pulled"

      - name: Deploy with Docker Compose
        run: |
          echo "Starting deployment on $(hostname) at $(date)"
          mkdir -p ~/gitops-app
          cp docker-compose.yml ~/gitops-app/
          cp docker-compose.prod.yml ~/gitops-app/
          cp -r monitoring/ ~/gitops-app/
          cd ~/gitops-app
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          echo "✅ Deployment complete"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

      - name: Health check
        run: |
          echo "Waiting 20 seconds for containers to start..."
          sleep 20
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost/health || echo "000")
          echo "Health check status: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "✅ Application is healthy"
          else
            echo "❌ Health check failed: ${HTTP_CODE}"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Rolling back..."
          cd ~/gitops-app || exit 0
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "============================================"
          echo "Build: ${{ needs.build-and-push.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "============================================"
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "App: http://10.245.99.201"
            echo "Grafana: http://10.245.99.201:3000"
            echo "Prometheus: http://10.245.99.201:9090"
          else
            echo "❌ DEPLOYMENT FAILED"
            exit 1
          fi
