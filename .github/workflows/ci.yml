# .github/workflows/ci.yml
# CI Pipeline — runs on every Pull Request to main
# Purpose: Catch quality issues that local hooks might miss
#
# Jobs:
#   1. shellcheck    — validate all bash scripts
#   2. yamllint      — validate all YAML files
#   3. secret-scan   — detect leaked credentials
#   4. docker-build  — verify Docker image builds successfully
#
# All jobs run in parallel for speed
# ALL must pass before PR can be merged

name: CI Pipeline

# =============================================================================
# TRIGGERS — When does this pipeline run?
# =============================================================================
on:
  # Run on every Pull Request targeting main
  pull_request:
    branches:
      - main
    # Run when PR is opened, updated, or reopened
    types: [opened, synchronize, reopened]

  # Also run on direct pushes to main (after merge)
  push:
    branches:
      - main

# Cancel previous runs if new commit is pushed
# Saves GitHub Actions minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — ShellCheck
  # Validates all bash scripts for errors and best practices
  # ---------------------------------------------------------------------------
  shellcheck:
    name: ShellCheck — Bash Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Find and check all shell scripts
        run: |
          echo "Finding all .sh files..."
          SHELL_FILES=$(find . -name "*.sh" -not -path "./.git/*" | sort)

          if [[ -z "${SHELL_FILES}" ]]; then
            echo "No shell scripts found"
            exit 0
          fi

          echo "Running shellcheck on:"
          echo "${SHELL_FILES}"
          echo ""

          # shellcheck disable=SC2086
          shellcheck -x ${SHELL_FILES}
          echo ""
          echo "✅ All shell scripts passed ShellCheck"

  # ---------------------------------------------------------------------------
  # JOB 2 — yamllint
  # Validates all YAML files for syntax errors
  # ---------------------------------------------------------------------------
  yamllint:
    name: yamllint — YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Find and validate all YAML files
        run: |
          echo "Finding all YAML files..."
          YAML_FILES=$(find . -name "*.yml" -o -name "*.yaml" | \
                      grep -v ".git" | sort)

          if [[ -z "${YAML_FILES}" ]]; then
            echo "No YAML files found"
            exit 0
          fi

          echo "Running yamllint on:"
          echo "${YAML_FILES}"
          echo ""

          ERRORS=0
          while IFS= read -r file; do
            if yamllint -d relaxed "${file}"; then
              echo "✅ ${file}"
            else
              echo "❌ ${file}"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "${YAML_FILES}"

          if [[ "${ERRORS}" -gt 0 ]]; then
            echo ""
            echo "❌ ${ERRORS} YAML file(s) failed validation"
            exit 1
          fi

          echo ""
          echo "✅ All YAML files passed validation"

  # ---------------------------------------------------------------------------
  # JOB 3 — Secret Scanning with Gitleaks
  # Scans entire Git history for leaked credentials
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so Gitleaks can scan all commits
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 4 — Docker Build Test
  # Verifies the Docker image builds without errors
  # Does NOT push to registry - just validates the build
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build — Image Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          dockerfile: ./app/Dockerfile
          target: production
          # push: false means build only, no push to registry
          push: false
          tags: gitops-nginx:ci-test
          # Cache layers between runs for speed
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: |
          docker images gitops-nginx:ci-test
          echo "✅ Docker image built successfully"

  # ---------------------------------------------------------------------------
  # JOB 5 — CI Summary
  # Runs after all other jobs - provides clear pass/fail status
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [shellcheck, yamllint, secret-scan, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "============================================"
          echo "CI Pipeline Results"
          echo "============================================"
          echo "ShellCheck:    ${{ needs.shellcheck.result }}"
          echo "yamllint:      ${{ needs.yamllint.result }}"
          echo "Secret scan:   ${{ needs.secret-scan.result }}"
          echo "Docker build:  ${{ needs.docker-build.result }}"
          echo "============================================"

          if [[ "${{ needs.shellcheck.result }}"   != "success" ]] || \
             [[ "${{ needs.yamllint.result }}"     != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}"  != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ CI FAILED — one or more jobs failed"
            exit 1
          fi

          echo "✅ ALL CI CHECKS PASSED"
